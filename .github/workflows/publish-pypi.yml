name: Publish to PyPI

# Trusted publishing (OIDC) — no long-lived token stored anywhere.
# Requires the pending publisher to be registered once on pypi.org:
#   project: prompt-defense-audit-guardrails
#   owner: ppcvote  repo: prompt-defense-audit-guardrails
#   workflow: publish-pypi.yml  environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Show the project name PyPI will receive
        # A pending publisher authenticates on owner/repo/workflow/environment,
        # but the upload still 400s if this name differs from the one registered
        # on pypi.org. Print it so a mismatch is one glance, not a log dig.
        run: |
          python - <<'EOF'
          import glob, pathlib, re, zipfile
          whl = glob.glob("dist/*.whl")[0]
          meta = zipfile.ZipFile(whl).read(
              [n for n in zipfile.ZipFile(whl).namelist()
               if n.endswith(".dist-info/METADATA")][0]).decode()
          name = re.search(r"^Name: (.+)$", meta, re.M).group(1)
          ver = re.search(r"^Version: (.+)$", meta, re.M).group(1)
          print(f"::notice::PyPI project name = {name!r} (version {ver}) "
                f"- this must match the pending publisher registered on pypi.org")
          EOF

      - name: Assert wheel ships only our own package
        run: |
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          top = {n.split("/")[0] for n in names}
          assert "validator" not in top, f"top-level validator leaked: {sorted(top)}"
          assert top <= {"prompt_defense_audit_guardrails"} | {
              n for n in top if n.endswith(".dist-info")
          }, f"unexpected top-level packages: {sorted(top)}"
          print("wheel layout OK:", sorted(top))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
